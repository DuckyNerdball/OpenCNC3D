<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anim Lab</title>
<style>
  :root {
    --bg: #15171c; --panel: #1e2128; --line: #2e323b; --text: #e6e6e6; --dim: #9aa0aa;
    --gold: #d6b25e; --green: #7fc97f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0 8px 0 0; color: var(--gold); letter-spacing: .04em; }
  label { color: var(--dim); display: inline-flex; gap: 6px; align-items: center; }
  select, button, input[type=range] { font: inherit; }
  select, button { background: #2a2e37; color: var(--text); border: 1px solid var(--line);
    border-radius: 5px; padding: 4px 9px; cursor: pointer; }
  button:hover, select:hover { border-color: var(--gold); }
  #main { flex: 1; display: flex; min-height: 0; }
  #views { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  #panel { width: 300px; flex: none; overflow: auto; padding: 12px 14px 16px;
    background: var(--panel); border-left: 1px solid var(--line); }
  [hidden] { display: none !important; }
  #panel h2 { font-size: 13px; margin: 14px 0 6px; letter-spacing: .06em; color: var(--gold); }
  #panel h2:first-child { margin-top: 0; }
  #panel h3 { font-size: 12px; font-weight: 600; margin: 10px 0 4px; color: var(--text);
    display: flex; align-items: center; gap: 8px; }
  #panel h3 small { font-weight: 400; color: var(--dim); }
  .sw { width: 18px; height: 18px; border-radius: 4px; border: 1px solid #0008; flex: none; }
  .row { display: grid; grid-template-columns: 74px 1fr 38px; gap: 6px; align-items: center;
    font-size: 12px; color: var(--dim); margin: 2px 0; }
  .row input { width: 100%; }
  .row output { text-align: right; font-variant-numeric: tabular-nums; }
  #pbtns { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  #pstate { font-size: 12px; margin-top: 8px; color: var(--dim); }
  #pstate.warn { color: var(--gold); } #pstate.ok { color: var(--green); }
  .view { position: relative; border-right: 1px solid var(--line); min-height: 0; }
  .view:last-child { border-right: 0; }
  .view canvas { display: block; width: 100%; height: 100%; }
  .tag { position: absolute; top: 10px; left: 12px; padding: 3px 9px; border-radius: 4px;
    background: rgba(0,0,0,.55); font-weight: 600; pointer-events: none; }
  .tag small { font-weight: 400; color: var(--dim); margin-left: 6px; }
  .tag.cur { color: var(--text); } .tag.twk { color: var(--green); }
  footer { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 8px 16px;
    background: var(--panel); border-top: 1px solid var(--line); }
  #frame { flex: 1; min-width: 180px; }
  #tweak { font: 12px/1.35 ui-monospace, Menlo, monospace; color: var(--dim);
    white-space: pre; max-height: 7.5em; overflow: auto; margin: 0; flex-basis: 100%; }
  #status { color: var(--dim); font-size: 12px; }
  @media (max-width: 900px) { #panel { width: 240px; } }
  @media (max-width: 700px) { #main { flex-direction: column; } #panel { width: auto; max-height: 45vh; }
    #views { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .view { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>ANIM LAB</h1>
  <label>Unit <select id="unit"></select></label>
  <label>Clip <select id="clip"></select></label>
  <label>View
    <select id="camsel">
      <option value="side">Side</option>
      <option value="front">Front</option>
      <option value="three">Three-quarter</option>
      <option value="game">Game camera</option>
    </select>
  </label>
  <label>Team colour <select id="team"></select></label>
  <label id="sidelab" hidden>Side <select id="side"><option value="gdi">GDI</option><option value="nod">Nod</option></select></label>
  <label>Show
    <select id="debug">
      <option value="0">Lit</option>
      <option value="1">Base colour</option>
      <option value="2">Normals (with map)</option>
      <option value="3">Normal map</option>
      <option value="4">Roughness</option>
      <option value="5">Metal</option>
      <option value="6">Occlusion</option>
      <option value="7">Team mask</option>
      <option value="8">Cloth mask</option>
      <option value="9">Shoulder emblem</option>
    </select>
  </label>
  <label>Light
    <select id="light">
      <option value="three">Three-point</option>
      <option value="sun">Sun</option>
    </select>
  </label>
  <button id="ptoggle">Colours</button>
  <label><input type="checkbox" id="ground" checked> Moving ground</label>
  <span id="status"></span>
</header>
<div id="main">
<div id="views">
  <div class="view" id="v0"><div class="tag cur">CURRENT <small>as the game plays it</small></div></div>
  <div class="view" id="v1"><div class="tag twk">TWEAKED <small id="twkinfo"></small></div></div>
</div>
<aside id="panel">
  <div id="sides"></div>
  <div id="pbtns">
    <button id="psave">Save</button>
    <button id="prevert">Back to the game's</button>
  </div>
  <div id="pstate"></div>
</aside>
</div>
<footer>
  <button id="play">Pause</button>
  <button id="prev">&#9664;</button><button id="next">&#9654;</button>
  <label>Speed <input type="range" id="speed" min="0.1" max="2" step="0.05" value="1"> <span id="speedv">1.00x</span></label>
  <input type="range" id="frame" min="0" max="1000" value="0">
  <span id="frameno">frame 0</span>
  <pre id="tweak"></pre>
</footer>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const $ = (id) => document.getElementById(id);
const loader = new GLTFLoader();
const clock = new THREE.Clock();
let manifest = null, manifestText = "", playing = true, speed = 1;
let phase = 0;                         // 0..1 through the loop, shared by both sides

// ---- two views, one camera ------------------------------------------------------------
const camera = new THREE.PerspectiveCamera(30, 1, 10, 20000);
const target = new THREE.Vector3(0, 280, 0);
const views = [0, 1].map((i) => {
  const el = $("v" + i);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  el.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1b1e24);
  // A dim room for the metal to reflect: without one a metal surface has nothing to show
  // and reads black, which is not what the game draws (it reflects its sky).
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  const hemi = new THREE.HemisphereLight(0xdfe8ff, 0x3a3226, 1.6);
  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.position.set(-600, 1400, 900);
  // THREE-POINT: a warm key from above the camera's left, a cool fill low on its right,
  // a rim from behind to cut the silhouette out of the background. They follow the
  // camera (placeLights), so the key stays on the side of him you are looking at.
  const key = new THREE.DirectionalLight(0xfff1e0, 3.0);
  const fill = new THREE.DirectionalLight(0xcfdcff, 0.9);
  const rim = new THREE.DirectionalLight(0xffffff, 2.6);
  const amb = new THREE.HemisphereLight(0xdfe8ff, 0x3a3226, 0.35);
  const aim = new THREE.Object3D();
  for (const l of [sun, key, fill, rim]) l.target = aim;
  scene.add(hemi, sun, key, fill, rim, amb, aim);
  const lights = { sun: [hemi, sun], three: [key, fill, rim, amb], key, fill, rim, aim };
  // THE GROUND: a grid one pack cell (1024 units) to a major square, scrolled under the
  // feet at the clip's own stride per loop, so a foot that slides shows as sliding.
  const grid = new THREE.GridHelper(8192, 32, 0x5a6070, 0x353a44);
  scene.add(grid);
  return { el, renderer, scene, grid, lights, model: null, mixer: null, action: null, info: null };
});
const controls = new OrbitControls(camera, views[0].renderer.domElement);
const controls2 = new OrbitControls(camera, views[1].renderer.domElement);
for (const c of [controls, controls2]) { c.target.copy(target); c.enableDamping = true; }
// For scripted framing from the browser console: lab.camera, lab.controls, lab.views.
window.lab = { camera, controls, controls2, views, THREE };

const CAMS = {                          // the model faces -z (north) at facing zero
  side:  [1600, 420, 0],
  front: [0, 420, -1600],
  three: [1150, 700, -1150],
  game:  [0, 1500, 1500],               // from the south and above, like the N64 camera
};
function setCam(k) {
  const p = CAMS[k];
  camera.position.set(p[0], p[1], p[2]);
  controls.target.set(0, 280, 0); controls2.target.set(0, 280, 0);
  camera.lookAt(controls.target);
  fit();
}

function resize() {
  for (const v of views) {
    const r = v.el.getBoundingClientRect();
    v.renderer.setSize(r.width, r.height, false);
    camera.aspect = r.width / Math.max(1, r.height);
  }
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);

// ---- the model shader's colours, and the map views ------------------------------------------
// EXACTLY THE GAME'S RULES (game/model3d_mod.h, the model shader), on linear albedo:
//   team:  alb = mix(alb, alb * team, teamMask)            the plates, helmet shell
//   cloth: alb = mix(alb, cloth * lum(alb) / clothRef, clothMask * amount)
// the team mask from the colour map's alpha, the cloth mask from where build.py put it
// (the emissive slot). One set of colour uniforms for every material; whether a material
// carries each mask is its own.
const U = {
  uTeam: { value: new THREE.Color(1, 1, 1) }, uTeamOn: { value: 1 },
  uCloth: { value: new THREE.Color(1, 1, 1) }, uClothAmt: { value: 0 },
  uClothRef: { value: 0.082 }, uDebug: { value: 0 },
  uSideNod: { value: 0 }, uLogo: { value: new THREE.Color(0.49, 0.48, 0.48) },
};
const FRAG_HEAD = `uniform vec3 uTeam; uniform float uTeamOn, uHasTeam;
uniform vec3 uCloth; uniform float uClothAmt, uClothRef, uHasCloth, uDebug;
uniform float uHasEmblem, uSideNod; uniform vec3 uLogo;
float labTeamM; float labClothM; float labLogoM;
`;
const FRAG_COLOUR = `#include <map_fragment>
labTeamM = 0.0; labClothM = 0.0; labLogoM = 0.0;
#ifdef USE_MAP
labTeamM = sampledDiffuseColor.a * uHasTeam;
diffuseColor.a = 1.0;
#endif
#ifdef USE_EMISSIVEMAP
vec3 labE = texture2D(emissiveMap, vEmissiveMapUv).rgb;
labClothM = labE.r * uHasCloth;
labLogoM = mix(labE.g, labE.b, uSideNod) * uHasEmblem;
#endif
diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * uTeam, labTeamM * uTeamOn);
float labLum = dot(diffuseColor.rgb, vec3(0.2126, 0.7152, 0.0722));
diffuseColor.rgb = mix(diffuseColor.rgb, uCloth * (labLum / uClothRef), labClothM * uClothAmt);
diffuseColor.rgb = mix(diffuseColor.rgb, uLogo, labLogoM);
`;
// A MAP VIEW replaces the lit colour with one input of the shader. Data (normals,
// roughness, metal, occlusion, masks) is shown as the texture holds it, so it is taken out
// of the sRGB the output applies; the base colour is a colour and is shown as one.
const FRAG_DEBUG = `#include <opaque_fragment>
if (uDebug > 0.5) {
  vec3 labC = vec3(0.0);
  bool labData = true;
  if (uDebug < 1.5) { labC = diffuseColor.rgb; labData = false; }
  else if (uDebug < 2.5) { labC = normalize((vec4(normal, 0.0) * viewMatrix).xyz) * 0.5 + 0.5; }
  else if (uDebug < 3.5) {
    labC = vec3(0.5, 0.5, 1.0);
#ifdef USE_NORMALMAP_TANGENTSPACE
    labC = texture2D(normalMap, vNormalMapUv).rgb;
#endif
  }
  else if (uDebug < 4.5) { labC = vec3(roughnessFactor); }
  else if (uDebug < 5.5) { labC = vec3(metalnessFactor); }
  else if (uDebug < 6.5) {
    labC = vec3(1.0);
#ifdef USE_AOMAP
    labC = vec3(texture2D(aoMap, vAoMapUv).r);
#endif
  }
  else if (uDebug < 7.5) { labC = vec3(labTeamM); }
  else if (uDebug < 8.5) { labC = vec3(labClothM); }
  else { labC = vec3(labLogoM); }
  if (labData) labC = pow(labC, vec3(2.2));
  gl_FragColor = vec4(labC, 1.0);
}
`;
function teamify(model) {
  model.traverse((o) => {
    if (!o.isMesh || !o.material) return;
    const m = o.material, ud = m.userData || {};
    m.envMapIntensity = 0.12;          // the room's light panels are bright enough to turn any metal to chrome
    const own = { uHasTeam: { value: ud.teamMask ? 1 : 0 }, uHasCloth: { value: ud.clothMask ? 1 : 0 },
                  uHasEmblem: { value: ud.emblem ? 1 : 0 } };
    m.onBeforeCompile = (sh) => {
      Object.assign(sh.uniforms, U, own);
      sh.fragmentShader = FRAG_HEAD + sh.fragmentShader
        .replace("#include <map_fragment>", FRAG_COLOUR)
        .replace("#include <opaque_fragment>", FRAG_DEBUG);
    };
    m.needsUpdate = true;
  });
}

// ---- the palette: GDI and Nod, as the game's SOLDIER PALETTE holds them --------------------
// Stored LINEAR (what the shader takes); the sliders are hue, saturation and brightness of
// the colour as it looks (sRGB), because that is how a colour is judged by eye.
const SIDES = { gdi: "GDI", nod: "Nod" };
let pal = null, saved = null, game = null;
const lin2s = (x) => x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(x, 1 / 2.4) - 0.055;
const s2lin = (x) => x <= 0.04045 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
function rgb2hsv([r, g, b]) {
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d > 1e-6) h = mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h * 60, mx > 0 ? d / mx : 0, mx];
}
function hsv2rgb([h, s, v]) {
  const f = (n) => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
  return [f(5), f(3), f(1)];
}
const toHsv = (lin) => rgb2hsv(lin.map((x) => lin2s(Math.min(1, x))));
const fromHsv = (hsv) => hsv2rgb(hsv).map((x) => +s2lin(x).toFixed(4));
const css = (lin) => "rgb(" + lin.map((x) => Math.round(255 * lin2s(Math.min(1, x)))).join(",") + ")";
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
let hsvState = {};                     // kept apart so a grey keeps the hue it had

function buildPanel() {
  const root = $("sides");
  root.innerHTML = "";
  hsvState = {};
  for (const [k, name] of Object.entries(SIDES)) {
    const h2 = document.createElement("h2"); h2.textContent = name; root.appendChild(h2);
    for (const [part, label, note] of [["team", "Team colour", "multiplies the plates"],
                                        ["cloth", "Cloth colour", "replaces the fabric"]]) {
      const id = k + "_" + part;
      hsvState[id] = toHsv(pal[k][part]);
      const h3 = document.createElement("h3");
      h3.innerHTML = `<span class="sw" id="sw_${id}"></span>${label} <small>${note}</small>`;
      root.appendChild(h3);
      const rows = [["Hue", 0, 360, 1, 0], ["Saturation", 0, 1, 0.01, 1], ["Brightness", 0, 1, 0.01, 2]];
      for (const [lab, mn, mx, st, ix] of rows) root.appendChild(slider(id + "_" + ix, lab, mn, mx, st,
        hsvState[id][ix], (v) => { hsvState[id][ix] = v; pal[k][part] = fromHsv(hsvState[id]); changed(); }));
    }
    root.appendChild(slider(k + "_amt", "Cloth amount", 0, 1, 0.01, pal[k].amount,
      (v) => { pal[k].amount = +v.toFixed(2); changed(); }));
  }
  changed(true);
}
function slider(id, label, mn, mx, st, val, on) {
  const row = document.createElement("div"); row.className = "row";
  row.innerHTML = `<span>${label}</span><input type="range" id="s_${id}" min="${mn}" max="${mx}" step="${st}"><output id="o_${id}"></output>`;
  const inp = row.querySelector("input"), out = row.querySelector("output");
  const show = (v) => { out.textContent = st >= 1 ? Math.round(v) : v.toFixed(2); };
  inp.value = val; show(+val);
  inp.oninput = () => { show(+inp.value); on(+inp.value); };
  return row;
}
function changed(quiet) {
  for (const k of Object.keys(SIDES)) for (const part of ["team", "cloth"])
    $("sw_" + k + "_" + part).style.background = css(pal[k][part]);
  setTeam();
  const st = $("pstate");
  if (saved && !same(pal, saved)) { st.textContent = "Changed, not saved."; st.className = "warn"; }
  else if (!saved && !same(pal, game)) { st.textContent = "Changed, not saved."; st.className = "warn"; }
  else if (saved && !same(saved, game)) { st.textContent = "Saved. Not in the game yet: ask for them to be pushed."; st.className = "warn"; }
  else { st.textContent = "These are the game's colours."; st.className = "ok"; }
}
async function loadPalette() {
  const r = await (await fetch("api/colours", { cache: "no-store" })).json();
  saved = r.saved; game = r.game;
  U.uClothRef.value = r.clothRef;
  if (r.logo) U.uLogo.value.setRGB(r.logo[0], r.logo[1], r.logo[2], THREE.LinearSRGBColorSpace);
  pal = JSON.parse(JSON.stringify(saved || game));
  buildPanel();
}
$("psave").onclick = async () => {
  const r = await fetch("api/colours", { method: "POST", body: JSON.stringify(pal) });
  const j = await r.json();
  if (!r.ok) { $("pstate").textContent = "Not saved: " + j.error; $("pstate").className = "warn"; return; }
  saved = j.saved; game = j.game; pal = JSON.parse(JSON.stringify(saved));
  changed();
};
$("prevert").onclick = () => { pal = JSON.parse(JSON.stringify(game)); buildPanel(); };
$("ptoggle").onclick = () => { $("panel").hidden = !$("panel").hidden; resize(); };

function setTeam() {
  const i = +$("team").value;
  const t = manifest && manifest.teams ? manifest.teams[i] : null;
  const skirmish = !!(t && t.label.startsWith("Skirmish"));
  $("sidelab").hidden = !skirmish;
  if (!pal || i < 0 || !t) { U.uTeamOn.value = 0; U.uClothAmt.value = 0; U.uSideNod.value = 0; return; }
  const side = skirmish ? $("side").value : (i === 0 ? "gdi" : "nod");
  U.uSideNod.value = side === "nod" ? 1 : 0;
  const c = skirmish ? t.rgb : pal[side].team;
  U.uTeam.value.setRGB(c[0], c[1], c[2], THREE.LinearSRGBColorSpace);
  U.uTeamOn.value = 1;
  const k = pal[side].cloth;
  U.uCloth.value.setRGB(k[0], k[1], k[2], THREE.LinearSRGBColorSpace);
  U.uClothAmt.value = pal[side].amount;
}
$("team").onchange = setTeam;
$("side").onchange = setTeam;
$("debug").onchange = (e) => { U.uDebug.value = +e.target.value; };
$("light").onchange = (e) => {
  for (const v of views) {
    for (const l of v.lights.sun) l.visible = e.target.value === "sun";
    for (const l of v.lights.three) l.visible = e.target.value === "three";
  }
};
$("light").onchange({ target: $("light") });
// The three-point lights sit where they are relative to the CAMERA, recomputed each frame.
const _r = new THREE.Vector3(), _u = new THREE.Vector3(), _b = new THREE.Vector3();
function placeLights(v) {
  const t = controls.target, L = v.lights;
  _b.copy(camera.position).sub(t).normalize();                 // towards the camera
  _r.crossVectors(camera.up, _b).normalize();                  // camera right
  _u.crossVectors(_b, _r).normalize();
  const put = (l, x, y, z) => l.position.copy(t).addScaledVector(_r, x * 1500)
    .addScaledVector(_u, y * 1500).addScaledVector(_b, z * 1500);
  put(L.key, -0.8, 0.9, 1.0);
  put(L.fill, 1.0, 0.1, 0.8);
  put(L.rim, 0.4, 1.0, -1.3);
  L.aim.position.copy(t);
}

// ---- loading ---------------------------------------------------------------------------
async function loadSide(v, file, info) {
  const gltf = await loader.loadAsync("out/" + file + "?t=" + Date.now());
  if (v.model) v.scene.remove(v.model);
  v.model = gltf.scene;
  v.model.traverse((o) => { if (o.isMesh) o.frustumCulled = false; });
  teamify(v.model);
  v.scene.add(v.model);
  v.mixer = new THREE.AnimationMixer(v.model);
  v.action = v.mixer.clipAction(gltf.animations[0]);
  v.action.play();
  v.info = info;
}

async function loadCurrent() {
  const u = $("unit").value, c = $("clip").value;
  const e = manifest.units[u].clips[c];
  $("status").textContent = "loading...";
  await Promise.all([loadSide(views[0], e.current.file, e.current),
                     loadSide(views[1], e.tweaked.file, e.tweaked)]);
  const tw = e.tweak && Object.keys(e.tweak).length ? JSON.stringify(e.tweak, null, 1)
                                                    : "{}   (no tweaks yet: both sides are the same loop)";
  $("tweak").textContent = "tweaks/" + u + "_" + c + ".json  " + tw;
  $("twkinfo").textContent = e.tweaked.seconds.toFixed(2) + " s a loop";
  $("status").textContent = e.anim + "  |  " + e.current.frames + " frames, "
    + e.current.seconds.toFixed(2) + " s a loop, stride " + Math.round(e.current.stride) + " units";
  $("frame").max = 1000;
  fit();
}

// FRAME THE POSE: the posed body's bounds on the clip's first frame, the camera kept on
// its current bearing and moved in or out so the whole body fills the view. A lying man
// is half a metre high and a standing one two, so one fixed framing cannot serve both.
function fit() {
  const v = views[0];
  if (!v.model) return;
  v.action.time = 0; v.mixer.update(0);
  v.model.updateMatrixWorld(true);
  const box = new THREE.Box3();
  v.model.traverse((o) => {
    if (o.isSkinnedMesh) { o.computeBoundingBox(); box.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld)); }
  });
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3()).length();
  const dir = camera.position.clone().sub(controls.target).normalize();
  target.copy(c);
  controls.target.copy(c); controls2.target.copy(c);
  camera.position.copy(c).addScaledVector(dir, size * 2.6);
  camera.lookAt(c);
}

function fillClips() {
  const u = $("unit").value;
  $("clip").innerHTML = "";
  for (const c of Object.keys(manifest.units[u].clips)) $("clip").add(new Option(c, c));
}

async function fetchManifest(first) {
  const r = await fetch("out/manifest.json?t=" + Date.now(), { cache: "no-store" });
  const text = await r.text();
  if (text === manifestText) return;
  manifestText = text;
  manifest = JSON.parse(text);
  // the menus follow the manifest, keeping what is selected when it still exists
  const keepU = $("unit").value, keepC = $("clip").value;
  $("unit").innerHTML = "";
  for (const [k, u] of Object.entries(manifest.units)) $("unit").add(new Option(u.label, k));
  if (!first && manifest.units[keepU]) $("unit").value = keepU;
  fillClips();
  if (!first && manifest.units[$("unit").value].clips[keepC]) $("clip").value = keepC;
  if (first && manifest.teams) {
    $("team").add(new Option("None (plates grey, cloth as painted)", -1));
    manifest.teams.forEach((t, i) => $("team").add(new Option(t.label, i)));
    $("team").value = 0;
    setTeam();
  }
  await loadCurrent();
}

// ---- controls --------------------------------------------------------------------------
$("unit").onchange = () => { fillClips(); loadCurrent(); };
$("clip").onchange = loadCurrent;
$("camsel").onchange = (e) => setCam(e.target.value);
$("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "Pause" : "Play"; };
$("speed").oninput = (e) => { speed = +e.target.value; $("speedv").textContent = speed.toFixed(2) + "x"; };
function step(d) {
  playing = false; $("play").textContent = "Play";
  const n = views[0].info ? views[0].info.frames : 24;
  phase = ((Math.round(phase * n) + d) % n + n) % n / n;
}
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);
$("frame").oninput = (e) => { playing = false; $("play").textContent = "Play"; phase = e.target.value / 1000; };

// ---- the loop --------------------------------------------------------------------------
function tick() {
  requestAnimationFrame(tick);
  const dt = clock.getDelta();
  controls.update(); controls2.update();
  // each side runs on its own clock (a speed tweak changes the loop's length), both
  // driven from one phase so a paused frame compares like with like
  const cur = views[0].info;
  if (playing && cur) phase = (phase + dt * speed / cur.seconds) % 1;
  for (const v of views) {
    if (!v.action || !v.info) continue;
    const secs = v.info.seconds;
    const p = v === views[1] ? phaseTweaked() : phase;
    v.action.time = p * secs;
    v.mixer.update(0);
    // THE GROUND moves back under him by the stride per loop, accumulated so it runs on
    // continuously across the loop's wrap (a stride is not a whole number of squares)
    let d = p - (v.lastP ?? p); if (d < -0.5) d += 1; if (d > 0.5) d -= 1;
    v.lastP = p;
    v.gz = ((v.gz || 0) + d * v.info.stride) % 256;
    v.grid.position.z = ($("ground").checked && v.info.stride > 0) ? v.gz : 0;
    placeLights(v);
    v.renderer.render(v.scene, camera);
  }
  if (cur) {
    $("frame").value = Math.round(phase * 1000);
    $("frameno").textContent = "frame " + Math.floor(phase * cur.frames) + " / " + cur.frames;
  }
}
// The tweaked side keeps its own tempo: if its loop is shorter it cycles faster.
let tphase = 0, lastPhase = 0;
function phaseTweaked() {
  const cur = views[0].info, tw = views[1].info;
  if (!cur || !tw) return phase;
  if (!playing) { tphase = phase; lastPhase = phase; return phase; }
  let d = phase - lastPhase; if (d < 0) d += 1;
  lastPhase = phase;
  tphase = (tphase + d * cur.seconds / tw.seconds) % 1;
  return tphase;
}

setCam("side");
resize();
fetchManifest(true).then(loadPalette).then(() => { resize(); tick(); });
// A tweak rebuilt on disk shows up on its own: the manifest is re-read every two seconds.
setInterval(() => fetchManifest(false).catch(() => {}), 2000);
</script>
